<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Componente | Nexus Hardware</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Nuevo Componente</h1>
        <p class="subtitle">Formulario de Alta (Plantilla Estática)</p>
    </header>

    <main class="container form-container">
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre del Componente</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej. Tarjeta Gráfica GTX 1660">
            </div>

            <div class="form-group">
                <label for="id_marca">Marca</label>
                <select id="id_marca" name="id_marca" required>
                    <option value="">-- Selecciona una Marca --</option>
                    <option value="1">MSI</option>
                    <option value="2">Asus</option>
                    <option value="3">Corsair</option>
                </select>
            </div>

            <div class="form-group">
                <label for="precio">Precio ($)</label>
                <input type="number" id="precio" name="precio" step="0.01" min="0" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="stock">Stock Disponible</label>
                <input type="number" id="stock" name="stock" min="0" required placeholder="0">
            </div>

            <button type="button" onclick="event.preventDefault();" class="btn btn-primary">Registrar Componente</button>
            <a href="#" onclick="event.preventDefault();" class="btn btn-outline" style="text-align: center; display: block; margin-top: 15px;">Cancelar / Volver al listado</a>
        </form>
    </main>

</body>
</html>
