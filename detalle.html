<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Registro | Nexus Hardware</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .detail-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            text-align: center;
        }
        .detail-card .price {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            font-weight: 900;
        }
        .detail-card .badge-container {
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Detalle de Registro</h1>
        <p class="subtitle">Información detallada (Plantilla Estática)</p>
    </header>

    <main class="container form-container">
        <div class="detail-card">
            <h2 style="font-size: 2rem;">RTX 4090</h2>
            <div class="badge-container">
                <span class="brand-badge" style="font-size: 1rem; padding: 6px 16px;">MSI</span>
            </div>
            
            <div class="price">$1,599.99</div>

            <div class="stock-indicator" style="font-size: 1.2rem; margin: 15px 0;">
                <div class="dot low-stock" style="width: 12px; height: 12px;"></div>
                <span>5 unidades disponibles en almacén</span>
            </div>
            
            <p style="color: var(--text-muted); font-size: 0.9rem;">ID del registro: #003</p>

            <a href="#" onclick="event.preventDefault();" class="btn btn-outline" style="margin-top: 30px; width: 100%;">Volver al catálogo</a>
        </div>
    </main>

</body>
</html>
